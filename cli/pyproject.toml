[project]
name = "krama-cli"
version = "0.1.0"
description = "An offline Python and FastAPI tutor that checks its own code (runs the Krama model through Ollama)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
krama = "krama_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krama_cli"]
